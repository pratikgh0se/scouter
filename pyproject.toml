[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-mcp"
dynamic = ["version"]
description = "MCP server for darktable photo management with headless library operations"
authors = [{name = "w1ne", email = "14119286+w1ne@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
# Floor is set by the hard dependencies, not by taste:
#   - darktable_mcp/cli/install_plugin.py uses importlib.resources.files (3.9+)
#   - every mcp release in the pinned range declares Requires-Python >=3.10
# so 3.10 is the lowest interpreter this package can actually install on.
requires-python = ">=3.10"
keywords = ["darktable", "mcp", "model-context-protocol", "photo-editing", "photography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Floor is 2.0: darktable_mcp/server.py registers its tools through the mcp 2.x
    # low-level Server(on_list_tools=..., on_call_tool=...) constructor handlers, which
    # replaced the 1.x @server.list_tools() / @server.call_tool() decorators. Neither
    # spelling exists in the other major, so 1.x cannot run this code.
    # Upper bound guards the next major the same way: 2.0 already moved the wire types
    # to mcp_types (Tool.inputSchema -> Tool.input_schema) and made handlers return
    # ListToolsResult / CallToolResult instead of bare lists.
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
vision = [
    "rawpy>=0.19",
    "Pillow>=10.0",
    "pyexiv2>=2.12",
]

[project.urls]
Homepage = "https://github.com/w1ne/darktable-mcp"
Repository = "https://github.com/w1ne/darktable-mcp"
Issues = "https://github.com/w1ne/darktable-mcp/issues"

[project.scripts]
darktable-mcp = "darktable_mcp:main"
scouter = "scouter:main"
scouter-mcp = "scouter.mcp.server:main"

[tool.setuptools.packages.find]
include = ["darktable_mcp*", "scouter*"]

[tool.setuptools.package-data]
darktable_mcp = ["lua/*.lua"]
scouter = ["data/wb/*.json"]

[tool.setuptools.dynamic]
version = {attr = "darktable_mcp.__version__"}

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N818 wants every exception class to end in "Error". Scouter's error classes
# are named by the phase 1 spec (section 9's table: BridgeTimeout, WrongView,
# NotInDarkroom, CliWroteNothing, DbLocked, StylePartial, CommitTimeout) and
# their names appear in the spec, the README and the audit log's `code`
# mapping. Renaming them to satisfy a style rule would put the code out of
# step with its own contract, so the rule is switched off deliberately rather
# than suppressed line by line.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Fixture/data builders: build_looks.py, _part2 and _part3 are concatenated
# into one namespace by the generator, so each part uses names (S, FILM_DT ...)
# defined in a sibling; F821 is expected per file. Rows are long source URLs
# and notes, and the code is terse generator glue.
"tests/gauntlet/data/build_*.py" = ["E501", "E402", "E731", "E741", "F821", "N802", "N803"]
# Tests: long literal strings and URLs, pytest fixtures re-declared as
# parameters (F811), short lambdas/names in throwaway helpers, mixedCase names
# that must match the ast.NodeVisitor / external API they mimic.
"tests/**" = ["E501", "E731", "E741", "F811", "N802", "N806", "N811", "N815"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
markers = [
    "host: launches a real darktable and needs SCOUTER_HOST_TESTS=1 (see tests/conftest.py). Deselected by default via addopts below; run explicitly with `-m host` (still requires the env var and darktable installed, or it self-skips).",
]
# Zenkai fix: the old convention was `pytest -k "not host"`, a substring match
# that also caught ~15 plain unit tests whose NAMES merely contain "host"
# (PinningHelpersTest, PluginInstallSafetyTest, HostClassTreeReleaseTest,
# HostSupportScopeTest, Phase3HostSlotsTest, the "hostile"-named tests, the
# task-10 vocab test, ...) even though none of them launch darktable. Those
# tests were never running under the documented command. The real host tests
# were already self-skipping via SCOUTER_HOST_TESTS (tests/conftest.py,
# tests/test_host_phase3.py) regardless of `-k`, so the env gate was always
# the thing keeping darktable from launching -- the `-k` filter only hid
# unrelated tests. Marking the real host classes with `host` and deselecting
# that marker here means plain `pytest -q` collects and runs the full unit
# suite (host tests included in the collection, but marker-skipped -- SKIPPED,
# not silently absent) without needing `-k` at all.
addopts = "-m 'not host'"
