name: CI

on:
  # Restricted to main (and tags): an unfiltered `push` alongside
  # `pull_request` runs the whole matrix twice for every commit on a PR
  # branch — 10 jobs where 5 will do. `pull_request` covers branches.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Manual run on any ref (e.g. a feature branch with no open PR).
  workflow_dispatch:
  # Weekly run against a fresh dependency resolution. Push/PR builds only prove the
  # code still works against the deps that existed when it was written; the scheduled
  # run is what catches an upstream release breaking us with no commit of our own
  # This is not hypothetical: mcp 2.0.0 dropped the @server.list_tools() /
  # @server.call_tool() decorators and broke this server on a clean install,
  # with no commit of ours in between. We have since ported to the 2.x
  # handlers; the cron is here to catch the next one.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the real floor: every mcp release in the pinned range declares
        # Requires-Python >=3.10, so the package cannot install on 3.9.
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_lua_dispatcher.py skips itself when no `lua` is on PATH, and a
      # skipped test reads as green. Install the interpreter so it actually runs,
      # and set DARKTABLE_MCP_REQUIRE_LUA below so that if a future runner image
      # loses Lua the suite goes red instead of quietly skipping.
      - name: Install Lua interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          command -v lua || sudo ln -s "$(command -v lua5.4)" /usr/local/bin/lua
          lua -v

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        env:
          DARKTABLE_MCP_REQUIRE_LUA: '1'
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    # The legacy tree predates the lint rules (ruff and black both have a large
    # backlog), so this gate lints only the Python files this push or PR touches:
    # new changes must be clean, old code is not mass-reformatted. Do NOT re-add
    # continue-on-error to get a red build green -- fix the finding.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Find changed Python files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push)
              BASE="$PUSH_BEFORE"
              if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
              fi
              ;;
            *) BASE="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)" ;;
          esac
          echo "base: $BASE"
          git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.py' > changed_py.txt
          echo "changed Python files:"
          cat changed_py.txt
          echo "count=$(wc -l < changed_py.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: ruff
        if: steps.changed.outputs.count != '0'
        run: xargs ruff check < changed_py.txt

      - name: black
        # `if: always()` so a ruff failure does not hide the black result.
        if: always() && steps.changed.outputs.count != '0'
        run: xargs black --check < changed_py.txt

  lua:
    name: lua dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          command -v lua || sudo ln -s "$(command -v lua5.4)" /usr/local/bin/lua
          lua -v

      # Mirrors tests/test_lua_dispatcher.py: `lua tests/lua/test_dispatcher.lua`
      # run from the repo root, which the script relies on for its package.path.
      - name: Run Lua dispatcher tests
        run: lua tests/lua/test_dispatcher.lua
